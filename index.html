<!DOCTYPE html>
<html>
<head>
  <base href="/wenjiapp/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="A private journal for the decisions you keep going back and forth on.">
  <meta name="theme-color" content="#FDF2EC">

  <!-- Installed to the home screen, it opens like an app -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Do I?">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Do I?</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #FDF2EC; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      font: 15px/1.6 -apple-system, BlinkMacSystemFont, "PingFang SC",
        "Microsoft YaHei", sans-serif;
      color: #6B5259; text-align: center; padding: 0 24px;
    }
    #loading .dot {
      width: 14px; height: 14px; border-radius: 50%; background: #B96B6E;
      margin-bottom: 12px; animation: pulse 1.2s ease-in-out infinite;
    }
    #loading p { margin: 0; }
    #slow { font-size: 13px; color: #8B747A; margin-top: 10px !important; }
    @keyframes pulse { 50% { opacity: .25; transform: scale(.7); } }
  </style>

  <script>
    // Ask the browser not to clear this site's data when space runs low.
    if (navigator.storage && navigator.storage.persist) {
      navigator.storage.persist().catch(function () {});
    }

    // Keeps the whole app cached so it still opens offline — or if this
    // website ever goes away.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
      // The first visit loads the renderer etc. before sw.js is running,
      // so tell it what was already fetched and let it cache those too.
      var cacheLoaded = function () {
        navigator.serviceWorker.ready.then(function (reg) {
          var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; });
          if (reg.active) reg.active.postMessage({ type: 'cache-loaded', urls: urls });
        });
      };
      window.addEventListener('flutter-first-frame', cacheLoaded);
      navigator.serviceWorker.ready.then(function () { setTimeout(cacheLoaded, 3000); });
    }
  </script>
</head>
<body>
  <!-- Shown until the app draws its first frame; a slow first load
       otherwise looks like a blank, broken page. -->
  <div id="loading">
    <div class="dot"></div>
    <p>正在加载… Loading…</p>
    <p id="slow" hidden>第一次打开需要多一点时间，请保持网络连接。<br>
      First visit takes a little longer — please stay online.</p>
  </div>
  <script>
    setTimeout(function () {
      var s = document.getElementById('slow'); if (s) s.hidden = false;
    }, 8000);
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loading'); if (l) l.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
